name: NestJS - testes de negócio sem Google/Mongo/Kafka reais
on:
  pull_request:
    branches: [main, fix/ws-route-scoped-auth-20261111]
  push:
    branches: [main, fix/internal-http-service-boundaries-20261111]
permissions:
  contents: read
jobs:
  unit:
    name: Jest rotas, Maps e rastreamento
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Instalar dependências pelo lock
        run: npm ci --no-audit --no-fund
      - name: Validar build TypeScript/NestJS
        run: npm run build
      - name: Executar oito suítes, incluindo teste HTTP in-memory
        run: >-
          npm test -- --runInBand --runTestsByPath
          src/routes/routes.service.spec.ts
          src/maps/directions/directions.service.spec.ts
          src/maps/places/places.service.spec.ts
          src/routes/routes-driver/routes-driver.service.spec.ts
          src/routes/routes-driver/routes-driver.gateway.spec.ts
          src/routes/routes-driver/routes-driver.consumer.spec.ts
          src/routes/routes.controller.spec.ts
          src/security/http-boundaries.spec.ts
